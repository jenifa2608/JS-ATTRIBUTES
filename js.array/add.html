<!DOCTYPE html>
<html>
    <head>
        <title>JavaScript Addition</title>
    </head>
    <body>
        <h2>JavaScript Addition</h2>
        <p id="result"></p>
        <script>
            var x=10;
            var y=20;
            var z=x+y;
            document.getElementsById("result").textContent=z;
        </script>
    </body>
</html>
