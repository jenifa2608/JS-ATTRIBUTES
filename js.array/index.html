<!DOCTYPE html>
<html>
<head>
    <title>Sum of Array</title>
</head>
<body>
    <h1>Array Elements :10,20,30,40,50</h1>
    <h2>Sum of Array</h2>
    <script>
        let arr = [10, 20, 30, 40, 50];
        let sum = 0;
            for (let i = 0; i < arr.length; i++) {
            sum = sum + arr[i];
        }
        document.write("Sum of Array: " + sum);
        alert(sum)
    </script>
</body>
</html>
